spring.application.name=thymeleaf
server.port=8081
# Configuración de recursos estáticos
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# Deshabilitar caché para desarrollo
spring.web.resources.add-mappings=true

# Base de datos H2 (en memoria)
spring.datasource.url=jdbc:h2:mem:wikidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# Carga de datos iniciales (data.sql)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Permitir conexión desde dentro de Docker (el navegador no entra como localhost)
spring.h2.console.settings.web-allow-others=true