<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Equipo
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="~{fragments/header :: header}"></div>
    <div th:replace="~{fragments/menu :: menu('equipo')}"></div>

    <main id="equipo">

        <h2>Integrantes del equipo</h2>

        <p th:if="${#lists.isEmpty(equipo)}">
            No hay integrantes registrados actualmente.
        </p>

        <section id="lista-equipo" th:unless="${#lists.isEmpty(equipo)}">

            <table>

                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Rol</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="miembro : ${equipo}">

                        <td class="miembro-nombre">

                            <img th:src="@{'/images/' + ${miembro.imagen}}" 
                            th:alt="${miembro.nombre}">

                            <strong th:text="${miembro.nombre}">
                                Nombre del integrante
                            </strong>

                        </td>

                        <td th:text="${miembro.rol}">
                            Rol del integrante
                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
